<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · MXAi v2</title>
<meta name="robots" content="noindex">
<style>
:root { --canvas:#d9dee2; --surface:#f3f5f6; --ink:#0f1418; --muted:#56606a; --line:#c5ccd2; --btn:#161b20; --btn-fg:#eef1f3; --bad:#9b2c2c; }
@media (prefers-color-scheme: dark) { :root { --canvas:#101316; --surface:#191d21; --ink:#e8ecef; --muted:#98a2ab; --line:#2b3238; --btn:#c6f432; --btn-fg:#0f1418; --bad:#f0928a; color-scheme:dark; } }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--canvas); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; }
form { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px; width:min(380px,100%); display:grid; gap:12px; }
h1 { margin:0; font-size:1.3rem; } p { margin:0; color:var(--muted); font-size:.9rem; }
input { font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
button { font:inherit; font-weight:600; background:var(--btn); color:var(--btn-fg); border:0; border-radius:8px; padding:10px 12px; cursor:pointer; }
input:focus-visible, button:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.err { color:var(--bad); min-height:1.2em; }
</style>
</head>
<body>
<form id="f">
  <h1>MXAi v2</h1>
  <p>Enter the admin key from <code>v2/.env</code> (V2_ADMIN_TOKEN).</p>
  <label for="k" style="position:absolute;left:-9999px">Admin key</label>
  <input id="k" type="password" autocomplete="current-password" placeholder="Admin key" required>
  <button type="submit">Sign in</button>
  <p class="err" id="e" role="alert"></p>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: document.getElementById('k').value }) });
  if (r.ok) location.href = '/eng-lab.html'; else document.getElementById('e').textContent = (await r.json().catch(() => ({}))).error || 'Sign-in failed.';
});
</script>
</body>
</html>
