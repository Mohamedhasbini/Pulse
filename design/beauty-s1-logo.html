<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Beauty S1 Logo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Montserrat:wght@500;600&display=swap">
<style>
body{margin:0;background:#141010;color:#f3e7df;font-family:Montserrat,sans-serif;display:flex;flex-wrap:wrap;gap:40px;padding:40px;align-items:center}
/* the mark: a mirror ring, a flowing serif S, a slender 1 crowned with a sparkle */
.mark{width:512px;height:512px;border-radius:50%;position:relative;overflow:hidden;
  background:radial-gradient(circle at 32% 26%,#3a2a26 0%,#1c1513 55%,#120d0c 100%)}
.mark svg{position:absolute;inset:0;width:100%;height:100%}
.lock{display:flex;align-items:center;gap:26px;padding:34px 44px;background:#1a1312;border-radius:28px}
.lock .mark{width:150px;height:150px}
.word{display:flex;flex-direction:column;gap:6px}
.word b{font:500 64px/1 "Cormorant Garamond",serif;font-variant-numeric:lining-nums;font-feature-settings:"lnum";letter-spacing:.02em;background:linear-gradient(100deg,#f6d7c3,#d9a38a 45%,#f3cdb8 70%,#b97a62);-webkit-background-clip:text;background-clip:text;color:transparent}
.word small{font:600 13px Montserrat;letter-spacing:.42em;color:#c9a08e;text-transform:uppercase;padding-left:4px}
.light{background:#f7f0ea}.light .word b{background-image:linear-gradient(100deg,#9b5d45,#c4826a 50%,#8a4f3a)}.light .word small{color:#8a5e4c}
</style></head><body>
<template id="t"><svg viewBox="0 0 512 512" aria-label="Beauty S1">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8dccb"/><stop offset=".45" stop-color="#dba48b"/><stop offset=".72" stop-color="#f4cfba"/><stop offset="1" stop-color="#b3735b"/></linearGradient>
    <linearGradient id="rg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8dccb"/><stop offset="1" stop-color="#b3735b"/></linearGradient>
  </defs>
  <!-- mirror ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#rg)" stroke-width="3" opacity=".85"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#rg)" stroke-width="1" opacity=".35"/>
  <!-- the S, set large in an italic serif -->
  <text x="236" y="352" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-weight="600" font-size="300" fill="url(#rg)">S</text>
  <!-- a hair strand sweeping through the S -->
  <path d="M120 318 C 190 250, 300 360, 392 214" fill="none" stroke="url(#rg)" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
  <path d="M132 334 C 205 272, 306 378, 398 236" fill="none" stroke="url(#rg)" stroke-width="1.2" stroke-linecap="round" opacity=".45"/>
  <!-- the 1: a slender stem crowned with a sparkle -->
  <rect x="352" y="196" width="9" height="150" rx="4.5" fill="url(#rg2)"/>
  <path d="M356.5 150 l7 19 l19 7 l-19 7 l-7 19 l-7 -19 l-19 -7 l19 -7 z" fill="#f8dccb"/>
  <circle cx="389" cy="148" r="3.2" fill="#f8dccb" opacity=".8"/>
  <!-- small caps under the monogram -->
  <text x="256" y="414" text-anchor="middle" font-family="Montserrat" font-weight="600" font-size="22" letter-spacing="10" fill="#d9a38a">BEAUTY</text>
</svg></template>
<div class="mark" id="mark" style="border-radius:0"></div>
<div class="lock" id="lockDark"><div class="mark"></div><div class="word"><b>Beauty S1</b><small>Hair · Skin · Nails</small></div></div>
<div class="lock light" id="lockLight"><div class="mark"></div><div class="word"><b>Beauty S1</b><small>Hair · Skin · Nails</small></div></div>
<script>document.querySelectorAll(".mark").forEach(m=>m.append(document.getElementById("t").content.cloneNode(true)))</script>
</body></html>
