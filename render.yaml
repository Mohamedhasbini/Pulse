# Render free tier: web service sleeps after 15 min idle. Database lives on Neon's free plan (no expiry).
services:
  - type: web
    name: pulse
    runtime: docker
    plan: free
    rootDir: app
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL # Neon connection string, pasted in Render
        sync: false
      - key: TZ
        value: Asia/Beirut
      - key: TIMEZONE
        value: Asia/Beirut
      - key: UPLOADS_DIR
        value: /tmp/uploads
      - key: DATA_KEY
        generateValue: true
      - key: WA_VERIFY_TOKEN
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
