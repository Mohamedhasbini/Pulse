# Render free tier: web service sleeps after 15 min idle; free Postgres expires after 30 days.
services:
  - type: web
    name: pulse
    runtime: docker
    plan: free
    rootDir: app
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: pulse-db, property: connectionString }
      - key: TZ
        value: Asia/Beirut
      - key: TIMEZONE
        value: Asia/Beirut
      - key: UPLOADS_DIR
        value: /tmp/uploads
      - key: DATA_KEY
        generateValue: true
      - key: WA_VERIFY_TOKEN
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

databases:
  - name: pulse-db
    plan: free
    databaseName: ringback
    user: ringback
