# Container logs are capped (3 files of 10 MB per service) so they never fill the disk
x-logging: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_DB: ringback
      POSTGRES_USER: ringback
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ringback"]
      interval: 5s
      retries: 10

  app:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://ringback:${DB_PASSWORD}@db:5432/ringback
      TZ: ${TIMEZONE:-Asia/Beirut}
    ports:
      - "127.0.0.1:3100:3100" # this PC only; the Cloudflare tunnel connects locally
    volumes:
      - uploads:/data/uploads
      - ./backups:/backups:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # node gets SIGTERM properly (init) and 20 s to finish messages being answered before Docker stops it
    init: true
    stop_grace_period: 20s
    # "healthy" only when the app and its database answer; tests and `--wait` wait for this, not just "running"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logs

  # Daily database backup into ./backups (kept 14 days). Restore: scripts/restore.sh <file>
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logs
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - uploads:/data/uploads:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y-%m-%d_%H%M)
          # the dump's own exit code decides (a pipe would only report gzip's); the database may still be starting: retry
          ok=0; for try in 1 2 3 4 5 6; do
            if pg_dump -h db -U ringback -d ringback --no-owner -f /backups/ringback-$$ts.sql.part; then ok=1; break; fi
            echo "backup try $$try failed, retrying in 30 s"; sleep 30
          done
          if [ $$ok = 1 ] && [ -s /backups/ringback-$$ts.sql.part ] && gzip -c /backups/ringback-$$ts.sql.part > /backups/ringback-$$ts.sql.gz.part; then
            rm -f /backups/ringback-$$ts.sql.part
            mv /backups/ringback-$$ts.sql.gz.part /backups/ringback-$$ts.sql.gz
            tar -czf /backups/uploads-$$ts.tar.gz -C /data uploads 2>/dev/null || true
            echo "backup ok $$ts"
          else
            rm -f /backups/ringback-$$ts.sql.part /backups/ringback-$$ts.sql.gz.part; echo "backup FAILED $$ts"
          fi
          # old copies are removed only on a day the new backup worked: failing days never eat the good ones
          if [ $$ok = 1 ] && [ -s /backups/ringback-$$ts.sql.gz ]; then find /backups -name '*.gz' -mtime +$$KEEP_DAYS -delete; fi
          sleep 86400
        done

volumes:
  dbdata:
  uploads:
